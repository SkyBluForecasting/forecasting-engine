version: '3.8'

services:
  base:
    build:
      context: .
      dockerfile: Dockerfile
    image: forecasting-base:latest
  mlflow:
    image: forecasting-base:latest
    container_name: mlflow
    env_file:
      - .env
    ports:
      - "5050:5050"
    command: >
      mlflow server
      --backend-store-uri "$MLFLOW_DB_URI"
      --default-artifact-root "$MLFLOW_ARTIFACT_ROOT"
      --host 0.0.0.0
      --port 5050
      --workers 1
    restart: always

  forecasting:  # Just a dev container
    image: forecasting-base:latest
    container_name: forecasting-tasks
    env_file:
      - .env
    volumes:
      - ./forecasting_engine:/app/forecasting_engine
    working_dir: /app
    command: tail -f /dev/null
    restart: always 

  forecast-poller:
    image: forecasting-base:latest
    container_name: forecast-poller
    env_file:
      - .env
    volumes:
      - ./forecasting_engine:/app/forecasting_engine
    working_dir: /app
    command: python -m forecasting_engine.services.forecast_poller.main
    restart: always

  forecast-enqueuer:
    image: forecasting-base:latest
    container_name: forecast-enqueuer
    env_file:
      - .env
    volumes:
      - ./forecasting_engine:/app/forecasting_engine
    working_dir: /app
    command: python -m forecasting_engine.services.forecast_enqueuer.main
    restart: always

  model-trainer: # Service that trains the models every Sunday at 4am UTC (11pm ET / Midnight EST)
    image: forecasting-base:latest
    container_name: model-trainer
    env_file:
      - .env
    volumes:
      - ./forecasting_engine:/app/forecasting_engine
    working_dir: /app
    command: >
      sh -c "echo '0 4 * * 0 python -m forecasting_engine.services.model_trainer.main' > /crontab &&
             supercronic /crontab"
    restart: always

  nonleaf-forecast-runner:  # Runs non-leaf forecasts bottom-up daily at 03:00 UTC
    image: forecasting-base:latest
    container_name: nonleaf-forecast-runner
    env_file:
      - .env
    volumes:
      - ./forecasting_engine:/app/forecasting_engine
    working_dir: /app
    command: >
      sh -c "echo '0 3 * * * python -m forecasting_engine.tasks.run_nonleaf_forecasts' > /crontab &&
             supercronic /crontab"
    restart: always

  weather-service:  # Runs weather service (assigning site IDs + pulling weather) daily at XXX
    image: forecasting-base:latest
    container_name: weather-site-assigner
    env_file:
      - .env
    volumes:
      - ./forecasting_engine:/app/forecasting_engine
    working_dir: /app
    command: >
      sh -c "echo '0 2 * * * python -m forecasting_engine.services.weather_site_assigner.main' > /crontab &&
             supercronic /crontab"
    restart: always
