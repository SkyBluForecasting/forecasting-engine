version: '3.8'

services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlflow
    env_file:
      - .env
    ports:
      - "5050:5050"
    command: >
      mlflow server
      --backend-store-uri "$MLFLOW_DB_URI"
      --default-artifact-root "$MLFLOW_ARTIFACT_ROOT"
      --host 0.0.0.0
      --port 5050

  forecasting:  # Just a dev container
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forecasting-tasks
    env_file:
      - .env
    volumes:
      - ./forecasting_engine:/app/forecasting_engine
    working_dir: /app
    command: tail -f /dev/null  


  training-poller:  # Polls the SQS queue for new training jobs
    build:
      context: .
      dockerfile: Dockerfile
    container_name: training-poller
    env_file:
      - .env
    volumes:
      - ./forecasting_engine:/app/forecasting_engine
    working_dir: /app
    command: python -m forecasting_engine.tasks.poll_training_queue