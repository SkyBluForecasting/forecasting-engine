name: Install Python Dependencies

on:
  workflow_dispatch:

jobs:
  install-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Install Python dependencies on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
            set -euxo pipefail
            cd ~/forecasting-engine

            # Make sure python3.11 is installed (optional if guaranteed by one-time setup)
            if ! command -v python3.11 &> /dev/null; then
              sudo dnf install -y python3.11
              sudo dnf clean all
            fi

            # Remove old virtualenv and create fresh one
            rm -rf venv
            python3.11 -m venv venv
            source venv/bin/activate

            # Install dependencies without cache to save space
            pip install --upgrade pip
            pip install --no-cache-dir -r requirements.txt
          EOF
