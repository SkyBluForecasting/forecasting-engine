name: Docs Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install documentation dependencies
        run: |
          cp requirements.txt forecasting_engine/openstef/docs/requirements.txt
          printf "\npydata-sphinx-theme==0.12.0\n" >> forecasting_engine/openstef/docs/requirements.txt
          printf "\njinja2==3.0.0\n" >> forecasting_engine/openstef/docs/requirements.txt
          printf "\nsphinx_autodoc_typehints==1.19.4\n" >> forecasting_engine/openstef/docs/requirements.txt
          printf "\nmkdocs==1.2.3\n" >> forecasting_engine/openstef/docs/requirements.txt
          pip install -r forecasting_engine/openstef/docs/requirements.txt

      - name: Generate Sphinx .rst files
        run: sphinx-apidoc -o forecasting_engine/openstef/docs forecasting_engine/openstef

      - name: Build Sphinx documentation
        run: sphinx-build -b html forecasting_engine/openstef/docs forecasting_engine/openstef/docs/_build/html
