name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Copy full app including Docker files to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='scripts' \
            --exclude='mlflow.db' \
            --exclude='artifacts' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/

      - name: Upload .env file to EC2
        run: |
          echo "${{ secrets.ENV_FILE_STAGING }}" > temp.env
          scp -o StrictHostKeyChecking=no temp.env ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/.env
          rm temp.env

      - name: Upload .htpasswd file to EC2
        run: |
          echo "${{ secrets.HTPASSWD_STAGING }}" > temp.htpasswd
          scp -o StrictHostKeyChecking=no temp.htpasswd ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/.htpasswd
          rm temp.htpasswd

      - name: Run Docker Compose on EC2 to build and start containers
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
            set -euxo pipefail
            cd ~/forecasting-engine

            # Ensure docker and docker-compose are installed and running
            if ! command -v docker > /dev/null; then
              echo "Docker not found, please install docker on the EC2 instance"
              exit 1
            fi

            if ! command -v docker-compose > /dev/null; then
              echo "docker-compose not found, please install docker-compose on the EC2 instance"
              exit 1
            fi

            # Pull latest images/build from Dockerfiles and start containers detached
            docker-compose down || true
            docker-compose up -d --build

            # Optional: wait for mlflow container to become healthy or responsive
            for i in $(seq 1 24); do
              if curl --fail --silent --max-time 3 http://localhost:5050; then
                echo "✅ MLflow is ready!"
                exit 0
              else
                echo "⏳ Waiting for MLflow to become ready..."
                sleep 5
              fi
            done

            echo "❌ MLflow did not become ready in time"
            docker-compose logs mlflow
            exit 1
          EOF
