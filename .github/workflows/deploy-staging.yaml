name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Sync app code to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='scripts' \
            -e "ssh -o StrictHostKeyChecking=no" \
            forecasting_engine/ requirements.txt \
            ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/

      - name: Upload .env to EC2
        run: |
          echo "${{ secrets.ENV_FILE_STAGING }}" > temp.env
          scp -o StrictHostKeyChecking=no temp.env ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/.env
          rm temp.env

      - name: Restart MLflow server on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
            set -ex
            cd ~/forecasting-engine
            source venv/bin/activate

            # Kill existing MLflow server if running
            pkill -f "mlflow server" || true

            # Start MLflow on localhost:5050
            nohup mlflow server \
              --backend-store-uri "${{ secrets.MLFLOW_DB_URI_STAGING }}" \
              --default-artifact-root "${{ secrets.MLFLOW_S3_BUCKET_URI_STAGING }}" \
              --host 127.0.0.1 \
              --port 5050 \
              > logs/mlflow.log 2>&1 &

            sleep 10
            if ! pgrep -f "mlflow server" > /dev/null; then
              echo "MLflow server not running, check logs:"
              tail -n 30 logs/mlflow.log
              exit 1
            fi
          EOF
