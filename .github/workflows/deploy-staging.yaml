name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Copy full app including Docker files to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='scripts' \
            --exclude='artifacts' \
            --exclude='test' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/

      - name: Upload .env file to EC2
        run: |
          echo "${{ secrets.ENV_FILE_STAGING }}" > temp.env
          scp -o StrictHostKeyChecking=no temp.env ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/.env
          rm temp.env

      - name: Upload deploy script to EC2
        run: |
          scp -o StrictHostKeyChecking=no .github/scripts/deploy.sh ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/deploy.sh

      - name: Run deploy script on EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=4 \
              ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
                set -euxo pipefail
                cd ~/forecasting-engine
      
                # Run the deploy script
                chmod +x deploy.sh
                DOCKER_BUILDKIT=0 ./deploy.sh
          EOF
