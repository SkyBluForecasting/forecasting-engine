name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Copy only needed files to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='scripts' \
            -e "ssh -o StrictHostKeyChecking=no" \
            forecasting_engine/ requirements.txt \
            ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/

      - name: Upload .env file to EC2
        run: |
          echo "${{ secrets.ENV_FILE_STAGING }}" > temp.env
          scp -o StrictHostKeyChecking=no temp.env ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/.env
          rm temp.env

      - name: Install dependencies and start MLflow
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
            set -euxo pipefail
            cd ~/forecasting-engine

            # Install Python 3.11 if not present
            if ! command -v python3.11 &> /dev/null; then
              sudo dnf install -y python3.11
              sudo dnf clean all
            fi

            # Recreate virtual environment
            rm -rf venv
            python3.11 -m venv venv
            source venv/bin/activate

            # Use root disk for temp files instead of /tmp
            mkdir -p ~/tmp
            export TMPDIR=~/tmp

            # Install dependencies
            pip install --upgrade pip
            pip install --no-cache-dir -r requirements.txt

            # Start MLflow
            export MLFLOW_DB_URI="${{ secrets.MLFLOW_DB_URI_STAGING }}"
            export MLFLOW_ARTIFACT_ROOT="${{ secrets.MLFLOW_S3_BUCKET_URI_STAGING }}"
            pkill -f "mlflow server" || true
            mkdir -p logs

            nohup mlflow server \
              --backend-store-uri "$MLFLOW_DB_URI" \
              --default-artifact-root "$MLFLOW_ARTIFACT_ROOT" \
              --host 127.0.0.1 \
              --port 5050 \
              > logs/mlflow.log 2>&1 &

            echo "🔁 Waiting for MLflow to become responsive..."
            for i in {1..24}; do
              if curl --fail --silent http://localhost:5050 > /dev/null; then
                echo "✅ MLflow is up!"
                break
              fi
              echo "⏳ Attempt $i: MLflow not ready yet"
              sleep 5
            done

            # Final confirmation
            if ! curl --fail --silent http://localhost:5050 > /dev/null; then
              echo "❌ MLflow not responsive after retry loop:"
              tail -n 30 logs/mlflow.log
              exit 1
            fi

            echo "✅ MLflow started successfully"
            tail -n 20 logs/mlflow.log
          EOF
  