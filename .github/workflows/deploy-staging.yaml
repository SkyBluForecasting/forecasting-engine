name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Log checkout success
        run: |
            echo "✅ Checkout step completed."
            echo "Current directory content:"
            ls -la

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}


      - name: Log SSH key setup
        run: |
            echo "✅ SSH key has been added to ssh-agent."
            ssh-add -l || echo "⚠️ No SSH keys loaded."

      - name: Copy only needed files to EC2
        run: |
            set -x
            rsync -avz --delete \
                --exclude='.git' \
                --exclude='scripts' \
                -e "ssh -o StrictHostKeyChecking=no" \
                forecasting_engine/ requirements.txt \
                ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/
        
      - name: Upload .env file to EC2 root folder (~/forecasting-engine)
        run: |
            echo "${{ secrets.ENV_FILE_STAGING }}" > temp.env
            scp -o StrictHostKeyChecking=no temp.env ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }}:~/forecasting-engine/.env
            rm temp.env
        
      - name: Confirm files on EC2
        run: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} \
                'ls -l ~/forecasting-engine && head -n 5 ~/forecasting-engine/.env'

      - name: Set up Python 3.11 virtualenv and install dependencies
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
            set -euxo pipefail
            cd ~/forecasting-engine
      
            # Install Python 3.11 if not present
            if ! command -v python3.11 &> /dev/null; then
              sudo dnf install -y python3.11
              sudo dnf clean all
            fi
      
            # Clean package manager caches to free disk space
            sudo rm -rf /var/cache/dnf
            sudo rm -rf /var/lib/dnf/history.*
            sudo dnf clean all
      
            # Clean pip cache to reduce space usage
            rm -rf ~/.cache/pip
      
            # Recreate virtual environment every time to avoid corruption
            rm -rf venv
            echo "Creating virtualenv with Python version:"
            python3.11 --version
            python3.11 -m venv venv
      
            # Activate virtualenv
            source venv/bin/activate
      
            # Use temp dir on root disk to avoid small /tmp space issue
            mkdir -p ~/tmp
            export TMPDIR=~/tmp
      
            # Upgrade pip and install dependencies without cache
            pip install --upgrade pip
            pip install --no-cache-dir -r requirements.txt
          EOF

      - name: Start MLflow Server on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
            set -ex
      
            export MLFLOW_DB_URI="${{ secrets.MLFLOW_DB_URI_STAGING }}"
            export MLFLOW_ARTIFACT_ROOT="${{ secrets.MLFLOW_S3_BUCKET_URI_STAGING }}"
      
            cd ~/forecasting-engine
      
            # Kill existing MLflow server if running
            pkill -f "mlflow server" || true
      
            # Ensure logs folder exists
            mkdir -p logs
      
            # Start MLflow in background
            nohup mlflow server \
              --backend-store-uri "$MLFLOW_DB_URI" \
              --default-artifact-root "$MLFLOW_ARTIFACT_ROOT" \
              --host 0.0.0.0 \
              --port 5050 \
              > logs/mlflow.log 2>&1 &
      
            sleep 5
      
            echo "🔍 Checking if MLflow started successfully..."
      
            # Check if the process is running
            if ! pgrep -f "mlflow server" > /dev/null; then
              echo "❌ MLflow server process not found. Check logs below:"
              tail -n 30 logs/mlflow.log
              exit 1
            fi
      
            # Optional: Local curl check
            if ! curl --fail http://localhost:5050 > /dev/null 2>&1; then
              echo "❌ MLflow did not respond on localhost:5050. Check logs below:"
              tail -n 30 logs/mlflow.log
              exit 1
            fi
      
            echo "✅ MLflow server started and is responsive."
      
            # Show final log output
            tail -n 20 logs/mlflow.log
          EOF