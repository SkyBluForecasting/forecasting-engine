name: Update NGINX Config

on:
  workflow_dispatch:

jobs:
  nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Configure nginx and restart
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
            set -euxo pipefail
            sudo htpasswd -bc /etc/nginx/.htpasswd "${{ secrets.MLFLOW_BASIC_AUTH_USER }}" "${{ secrets.MLFLOW_BASIC_AUTH_PASSWORD }}"
            sudo tee /etc/nginx/conf.d/mlflow.conf > /dev/null << 'NGINXCONF'
            server {
                listen 80;
                location / {
                    auth_basic "Restricted";
                    auth_basic_user_file /etc/nginx/.htpasswd;
                    proxy_pass http://127.0.0.1:5050;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINXCONF
            sudo systemctl restart nginx
          EOF
