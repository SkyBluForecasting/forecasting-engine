name: Update NGINX Config

on:
  workflow_dispatch:

jobs:
  update-nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Update nginx config and basic auth on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER_STAGING }}@${{ secrets.EC2_HOST_STAGING }} << 'EOF'
            set -ex
            # Create htpasswd with latest creds
            sudo htpasswd -bc /etc/nginx/.htpasswd "${{ secrets.MLFLOW_BASIC_AUTH_USER }}" "${{ secrets.MLFLOW_BASIC_AUTH_PASSWORD }}"

            # Write nginx config
            sudo tee /etc/nginx/conf.d/mlflow.conf > /dev/null << 'NGINXCONF'
            server {
                listen 80;
                location / {
                    auth_basic "Restricted";
                    auth_basic_user_file /etc/nginx/.htpasswd;
                    proxy_pass http://localhost:5050;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINXCONF

            # Restart nginx
            sudo systemctl enable nginx
            sudo systemctl restart nginx
          EOF
